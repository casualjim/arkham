# Project-layer config for the transparent integration demo (loaded via
# `arkham serve --proxy-backend tproxy --config`. The client shares arkham's network
# namespace and holds only the deterministic fake printed by
# `arkham fake GH_TOKEN`; capture is via TPROXY policy routing.
#
# The tcp:// grant host is the literal destination IP: captured raw TCP has no
# SNI, the dst address is the identity (crates/arkham-tproxy/src/tproxy.rs tproxy_conn_task).
# Hence the static api address in compose.yaml.
[proxy]
listen = "0.0.0.0:8080"
ca_file = "/certs/ca.pem"

# GH_TOKEN is registry-known (github), so resolution unions the registry's
# hosts into `allow` below. `registry = false` keeps only the literal hosts.
# No rule carries a `value`: real values resolve from fnox at serve time
# (integration/gen-secrets.sh renders the fnox config from the
# environment), the production pattern.
[rules.demo]
env = "GH_TOKEN"
allow = ["https://api:8443", "http://api:8000", "tcp://10.202.0.20:9000", "https://api:9443"]

# The api leaf is signed by the loaded CA itself: egress trusts it per
# entry, since the arkham CA is no egress anchor.
[rules.demo.tls."https://api:8443"]
root_cert = "/certs/ca.crt"

[rules.demo.tls."https://api:9443"]
root_cert = "/certs/ca.crt"

# SSH: its own rule — an ssh rule's allow entries are all ssh, the two key
# blobs ride the entry, and host keys are accept-new on both legs, so
[rules.ssh]
env = "SSH_KEY"
registry = false
if_missing = "ignore"
allow = ["ssh://10.202.0.40:22"]

[rules.ssh.ssh."ssh://10.202.0.40:22"]
identity = "/certs/ssh/identity"
guest_key = "/certs/ssh/decoy.pub"

# Real PostgreSQL on the server net, as a connection-string rule: the rule
# states only the fake — a proper `postgres://` URL, so the env var the
# guest reads holds a URL — and the real connection string lives in the
# secret source (fnox.toml beside this file, mounted under the config dir).
# No allow entries: the connection string is the grant, matched on the
# fake's port, because a transparently captured connection carries no
# hostname the capture knows (libpq sent no SNI before PostgreSQL 17 —
# PostgreSQL 17+ does, and arkham re-keys on it). The strings name the host
# the way real deployments do — a hostname, never an IP. Both passwords
# are the same length — the wire machine swaps in place.
[rules.db]
env = "DATABASE_URL"
value = "postgres://arkham:arkham_fake_password_01@db:5432/demo?sslmode=require"

# Token-issuer leg: the client holds the fake client secret, arkham swaps
# it to the real one at /token, mints a decoy for the returned access
# token, and swaps the decoy back on every later request. `registry =
# false` keeps the literal hosts; the oauth2 block grants the issuer leg
# (its token_url authority unions into allow).
[rules.oidc]
env = "OIDC_CLIENT_SECRET"
registry = false
allow = ["http://api:8000"]

[rules.oidc.oauth2]
flow = "client_credentials"
token_url = "http://api:8000/token"

# Redis plaintext: requirepass-style auth plus ACL username/password,
# matched on the fake string's port. Both passwords are the same length.
[rules.redis_plain]
env = "REDIS_URL"
value = "redis://arkham_user:arkham_fake_redis_pass@redis:6379/0"

# Redis over TLS: the same auth patterns, but rediss:// states TLS on
# both legs. The upstream string carries trust; the guest leg uses the
# arkham-minted leaf.
[rules.redis_tls]
env = "REDIS_TLS_URL"
value = "rediss://arkham_user:arkham_fake_redis_pass@redis:6380/0"
